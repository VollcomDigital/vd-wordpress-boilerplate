; Minimal baseline php.ini (container-friendly)

expose_php = 0

memory_limit = 256M
max_execution_time = 60
max_input_vars = 2000

post_max_size = 64M
upload_max_filesize = 64M

; Send errors to stderr for container logs.
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off

date.timezone = UTC

