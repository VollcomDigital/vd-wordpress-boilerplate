[www]
user = app
group = app

listen = /var/run/php/php-fpm.sock
listen.owner = app
; Nginx unprivileged image runs as uid/gid 101. Set the socket group to 101 so
; the web container can connect without elevating privileges.
listen.group = 101
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

clear_env = no
catch_workers_output = yes

; Health endpoints (proxied by Nginx)
ping.path = /ping
pm.status_path = /status

