server {
  listen 8080 default_server;
  server_name _;

  root /var/www/html/web;
  index index.php;

  include /etc/nginx/snippets/security-headers.conf;

  # Basic liveness probe
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Nginx stub_status for Prometheus exporter (restricted to private ranges).
  location = /nginx_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }

  # Don't serve hidden files (.env, .git, etc).
  location ~ /\.(?!well-known).* {
    deny all;
  }

  # Block common sensitive files (defense-in-depth).
  location ~* /(composer\.(json|lock)|\.env|\.git|wp-config\.php)$ {
    deny all;
  }

  # Cache static assets.
  location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|eot)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Never execute PHP from user-writable directories.
  location ~* ^/app/(?:uploads|cache)/.*\.php$ {
    deny all;
  }

  # WordPress / Bedrock front controller.
  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  # PHP handler.
  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_index index.php;
    fastcgi_read_timeout 60s;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
  }

  # php-fpm ping/status endpoints
  location = /ping {
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
  }

  location = /status {
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }
}

