services:
  web:
    image: ${IMAGE_WEB:-ghcr.io/OWNER/REPO-nginx:main}
    ports:
      - "8080:8080"
    depends_on:
      - php
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/cache/nginx:rw,nosuid,size=32m
    volumes:
      - php-socket:/var/run/php
      - uploads:/var/www/html/web/app/uploads
      - cache:/var/www/html/web/app/cache

  php:
    image: ${IMAGE_PHP:-ghcr.io/OWNER/REPO-php:main}
    env_file:
      - .env
    depends_on:
      - db
      - redis
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - php-socket:/var/run/php
      - uploads:/var/www/html/web/app/uploads
      - cache:/var/www/html/web/app/cache

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
  php-socket:
  uploads:
  cache:

