# SonarCloud configuration for this boilerplate repository.
#
# Project identity is typically provided by CI (recommended), for example:
#   -Dsonar.organization=<your-org>
#   -Dsonar.projectKey=<your-org>_<your-repo>
#
# You can uncomment and set the values below if you prefer storing them here.
# sonar.organization=
# sonar.projectKey=

sonar.projectName=Modern Cloud Native WordPress Boilerplate
sonar.sourceEncoding=UTF-8

# Scan the repository, then explicitly exclude generated/third-party/runtime paths.
sonar.sources=.
sonar.exclusions=vendor/**,web/wp/**,web/app/uploads/**,web/app/plugins/**,web/app/cache/**,.certs/**,**/.gitkeep
sonar.cpd.exclusions=vendor/**,web/wp/**

