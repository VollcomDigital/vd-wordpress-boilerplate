# Template SealedSecret.
#
# IMPORTANT:
# - Do not put real plaintext secrets in git.
# - Use kubeseal to generate encryptedData values for your cluster/controller.
#
# Example:
#   kubectl -n wp create secret generic wp-secrets \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=AUTH_KEY='...' \
#     ... \
#     --dry-run=client -o yaml \
#   | kubeseal --format yaml > sealedsecret-wordpress.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wp-secrets
  namespace: wp
spec:
  encryptedData:
    DB_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    AUTH_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    SECURE_AUTH_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    LOGGED_IN_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    NONCE_KEY: REPLACE_WITH_KUBESEAL_OUTPUT
    AUTH_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
    SECURE_AUTH_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
    LOGGED_IN_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
    NONCE_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: wp-secrets
      namespace: wp
    type: Opaque

