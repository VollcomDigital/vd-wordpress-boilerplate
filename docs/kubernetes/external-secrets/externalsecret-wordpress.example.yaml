# Template example that materializes a Kubernetes Secret with Bedrock/WordPress keys.
#
# Assumptions:
# - You already created/configured a ClusterSecretStore (example: aws-secretsmanager)
# - Your secret manager contains a JSON document with these fields
#
# Docs:
#   https://external-secrets.io/latest/api/externalsecret/

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wp-secrets
  namespace: wp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: wp-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        # Example: ARN or secret name in your provider
        key: REPLACE_ME/wordpress/production

