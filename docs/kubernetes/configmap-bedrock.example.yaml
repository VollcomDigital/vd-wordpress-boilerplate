# Example ConfigMap for Bedrock env vars (non-secret).
#
# Create your own and reference it via:
#   config.existingConfigMap: wp-env
#
# NOTE: Do NOT put credentials or salts here. Use a Secret instead.

apiVersion: v1
kind: ConfigMap
metadata:
  name: wp-env
  namespace: wp
data:
  WP_ENV: "production"
  WP_HOME: "https://wp.example.com"
  WP_SITEURL: "https://wp.example.com/wp"

  DISABLE_WP_CRON: "true"
  DISALLOW_FILE_MODS: "true"
  WP_CACHE: "false"
  WP_DEFAULT_THEME: "starter-theme"

  DB_HOST: "my-db.example.com:3306"
  DB_NAME: "wordpress"
  DB_USER: "wordpress"
  DB_PREFIX: "wp_"

  # Optional: Redis object cache (plugin required)
  WP_REDIS_HOST: ""
  WP_REDIS_PORT: "6379"

  # Optional: S3 uploads offload (plugin required, e.g. humanmade/s3-uploads)
  S3_UPLOADS_BUCKET: "my-bucket"
  S3_UPLOADS_REGION: "us-east-1"
  S3_UPLOADS_BUCKET_URL: "https://cdn.example.com"
  S3_UPLOADS_ENDPOINT: ""
  S3_UPLOADS_PATH_STYLE_ENDPOINT: "false"
  S3_UPLOADS_USE_INSTANCE_PROFILE: "true"

