name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  php:
    name: Composer validate / lint / audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
          extensions: intl, mbstring, curl, zip
          ini-values: memory_limit=512M

      - name: Composer validate
        run: composer validate --strict

      - name: Composer install (dev)
        run: composer install --no-interaction --no-progress

      - name: Lint (Pint)
        run: composer lint

      - name: Composer audit
        run: composer audit

  local-smoke:
    name: Local stack smoke (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local .env for CI
        run: |
          cp .env.example .env
          echo "APP_UID=$(id -u)" >> .env
          echo "APP_GID=$(id -g)" >> .env
          echo "WP_ADMIN_PASSWORD=ci-smoke-password" >> .env

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Doctor preflight
        run: make doctor

      - name: Bootstrap stack
        run: make bootstrap

      - name: Smoke checks
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ping >/dev/null
          curl -fsS http://localhost:8080/wp/wp-login.php | rg -qi "user_login|wordpress"
          make wp ARGS="core is-installed --path=web/wp"

      - name: Compose status/logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans

  helm:
    name: Helm lint / template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: >
          helm lint helm/wp-boilerplate
          --set image.php.tag=ci
          --set image.web.tag=ci

      - name: Helm template (render)
        run: >
          helm template wp helm/wp-boilerplate
          --namespace wp
          --set image.php.tag=ci
          --set image.web.tag=ci
          > /tmp/wp-boilerplate.rendered.yaml

      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION="v0.7.0"
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Kubeconform validate rendered manifests
        run: |
          set -euo pipefail
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.29.0 \
            /tmp/wp-boilerplate.rendered.yaml

