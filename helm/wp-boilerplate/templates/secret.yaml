{{- if and (not .Values.secret.existingSecret) .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wp-boilerplate.fullname" . }}-secret
  labels:
    {{- include "wp-boilerplate.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}

